# Źródło: child-train@b881e09:.github/workflows/deploy.yml (publikacja przez actions/deploy-pages).
# Ten plik nie reaguje sam na push ani na ręczny dispatch. Wywołuje go checks.yml po testach.
name: Deploy to GitHub Pages

on:
  workflow_call:

jobs:
  publish:
    # Ochrona również, gdyby inny workflow wywołał ten plik w przyszłości.
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
