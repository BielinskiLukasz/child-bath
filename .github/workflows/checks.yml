# Źródło: child-train@b881e09:.github/workflows/deploy.yml (publikacja artefaktu dist/ na GitHub Pages).
# W child-bath publikacja jest wywoływana w tym samym przebiegu dopiero po testach.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        uses: ./.github/actions/setup-project
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test the build
        env:
          PLAYWRIGHT_PREBUILT: "1"
        run: npm test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Upload tested Pages artifact
        if: >-
          ${{ success() && github.ref == 'refs/heads/main' &&
              (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: checks
    if: >-
      ${{ success() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
